name: Build Kernel

on:
  push:
    branches: [ main-new ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu
        
    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out vendor/pipa_defconfig
        make O=out -j$(nproc)
        
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image.gz
        
    - name: Upload DTB
      uses: actions/upload-artifact@v3
      with:
        name: dtb-files
        path: out/arch/arm64/boot/dts/**/*.dtb
